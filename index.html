<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tetris — Mobile Fit</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <style>
    html, body {
      margin:0; padding:0; width:100vw; height:100vh;
      background:#111; font-family: 'Press Start 2P', monospace;
      box-sizing: border-box; overflow:hidden;
    }
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body {
      min-height:100vh; width:100vw; display:flex; flex-direction:column; align-items:center; justify-content: flex-start;
    }
    /* ---------- HOME PAGE ---------- */
    #home {
      position:fixed; left:0; top:0; width:100vw; height:100vh; z-index:10;
      background: linear-gradient(135deg, #222 59%, #191963 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      animation:fadeIn .7s;
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    #logo {
      letter-spacing: 1vw;
      font-family: 'Press Start 2P', monospace;
      font-size: 2.2em;
      color: #f0a000;
      text-shadow: 0 0 .15em #00f0f0, 0 0 .08em #fff, 0 2px 8px #0006;
      margin-bottom: 0.40em;
      margin-top: -1em;
      user-select: none;
    }
    .tetris-block {
      display:inline-block;
      width:22px; height:22px;
      margin:2px; border-radius:5px;
      vertical-align:middle;
      box-shadow:0 1px 3px #0007;
    }
    .cI { background:#00f0f0;}
    .cJ { background:#0000f0;}
    .cL { background:#f0a000;}
    .cO { background:#f0f000;}
    .cS { background:#00f000;}
    .cT { background:#a000f0;}
    .cZ { background:#f00000;}
    #home-tip {
      color: #6ee;
      font-size: 1.1em;
      margin-top: .2em;
      margin-bottom: 1.2em;
      opacity: .93;
    }
    #play-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.3em;
      border-radius: 7px;
      background: linear-gradient(90deg, #2a2a8d 60%, #f0a000 125%);
      color: #fff;
      border: none; box-shadow: 0 2px 12px #0008;
      padding: .65em 2.3em;
      margin-top: 1.1em;
      margin-bottom: 2em;
      letter-spacing: .11em;
      cursor:pointer;
      transition: background .22s, transform .14s;
      user-select: none;
      outline: none;
    }
    #play-btn:active {
      background: linear-gradient(90deg, #2d2d98 60%, #ffd800 125%);
      transform: scale(0.97);
    }
    /* ----------- GAME PAGE ---------- */
    #game {
      position:relative;
      width:100vw;
      display:none;
      flex-direction: column;
      align-items:center;
      justify-content: flex-start;
      animation:fadeIn .3s;
    }
    #score { font-size:1.2em; margin:.5em 0 .1em 0;}
    #next-label { font-size:1.05em; font-weight:bold; color:#eee; margin:0.09em 0 0.15em 0; text-align:center;}
    #next { background:#222; border-radius:6px; box-shadow: 0 1px 7px #0003; width:72px; text-align:center;
      font-size:.98em; opacity:.89; padding:.10em 0 .10em 0; margin-bottom:0.18em;}
    .next-board { display:inline-block; }
    #tetris-board {
      background:#222; border-radius:8px; box-shadow:0 0 14px #0006;
      user-select:none; touch-action:none; margin:0 auto .09em auto; position:relative; overflow:hidden; display:block;
    }
    .row { display:flex;}
    .cell {
      box-sizing: border-box; border: 1px solid #222;
      background:#444;
      transition:background .09s;
    }
    .I { background: #00f0f0; }
    .J { background: #0000f0; }
    .L { background: #f0a000; }
    .O { background: #f0f000; }
    .S { background: #00f000; }
    .T { background: #a000f0; }
    .Z { background: #f00000; }
    #controls {
      display:flex; flex-direction:row; justify-content:center; align-items:center;
      gap:.6em; margin:.32em 0 .02em 0;
    }
    .arrow-btn {
      width:32px; height:32px; border-radius:50%; background:#353535; color:#eee; border:none; font-size:1.32em; margin:0 1.3px;
      box-shadow:0 2px 7px #0003; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:background .13s; user-select:none;
    }
    .arrow-btn:active { background: #444; }
    #footer-tip {
      margin-top: .05em; opacity: .80; font-size: .92em; text-align:center; max-width:20em; margin-bottom:.06em;
    }
    @media (max-width:500px) {
      #tetris-board { min-width:75px;}
      .arrow-btn { width:23px; height:23px; font-size:.92em;}
      #next {width:34px; font-size:.86em;}
      #score {font-size:.95em;}
    }
  </style>
</head>
<body>
  <!-- Tetris HOME PAGE -->
  <div id="home">
    <div id="logo">
      <span class="cT tetris-block"></span>
      <span class="cI tetris-block"></span>
      <span class="cT tetris-block"></span>
      <span class="cR tetris-block"></span>
      <span class="cE tetris-block"></span>
      <span class="cT tetris-block"></span>
      <span class="cR tetris-block"></span>
      <span class="cI tetris-block"></span>
      <span class="cS tetris-block"></span>
      <br/>TETRIS
    </div>
    <div id="home-tip">Classic arcade puzzle, made for your phone.</div>
    <button id="play-btn">Play</button>
  </div>
  <!-- Tetris GAME PAGE (initially hidden) -->
  <div id="game">
    <div id="score">Score: 0</div>
    <div id="next-label">Next</div>
    <div id="next">
      <div class="next-board" id="next-piece"></div>
    </div>
    <div id="tetris-board"></div>
    <div id="controls">
      <button class="arrow-btn" id="arrow-left">&#8592;</button>
      <button class="arrow-btn" id="arrow-rot">&#8635;</button>
      <button class="arrow-btn" id="arrow-down">&#8595;</button>
      <button class="arrow-btn" id="arrow-right">&#8594;</button>
    </div>
    <div id="footer-tip">
      <b>Controls:</b> Buttons below, tap left/right/middle, swipe down. Keyboard works too.
    </div>
  </div>
  <script>
    // --- HOME PAGE ANIMATION ---
    document.getElementById("play-btn").onclick = function() {
      document.getElementById("home").style.display = "none";
      document.getElementById("game").style.display = "flex";
      window.dispatchEvent(new Event('resize')); // redraw game
    };

    // --- Classic dimensions, but fit perfectly ---
    const COLS = 10, DEFAULT_ROWS = 20, MIN_BLOCK = 28;
    function fitBoard() {
      const uiHeight =
        (document.getElementById('score').offsetHeight || 26) +
        (document.getElementById('next').offsetHeight || 28) +
        (document.getElementById('controls').offsetHeight || 32) +
        (document.getElementById('footer-tip').offsetHeight || 13) +
        19;
      const availH = window.innerHeight - uiHeight;
      const availW = Math.min(window.innerWidth * 0.98, 470);

      let rows = DEFAULT_ROWS, block = Math.floor(Math.min(availH/rows, availW/COLS));
      while (block < MIN_BLOCK && rows > 8) {
        rows--;
        block = Math.floor(Math.min(availH/rows, availW/COLS));
      }
      return {rows, block};
    }

    let ROWS, arena, cellPx, score = 0, falling, next, interval, SHAPE_KEYS;
    const SHAPES = {
      I: [[1,1,1,1]], J: [[1,0,0],[1,1,1]], L: [[0,0,1],[1,1,1]],
      O: [[1,1],[1,1]], S: [[0,1,1],[1,1,0]], T: [[0,1,0],[1,1,1]], Z: [[1,1,0],[0,1,1]]
    };
    const COLORS = { 'I':'I', 'J':'J', 'L':'L', 'O':'O', 'S':'S', 'T':'T', 'Z':'Z' };

    function setupArena(rows) {
      arena = Array.from({length:rows}, ()=>Array(COLS).fill(''));
    }
    function newPiece(type) {
      if (!type) type = SHAPE_KEYS[Math.floor(Math.random()*SHAPE_KEYS.length)];
      const shape = SHAPES[type].map(r=>r.slice());
      return {x:Math.floor(COLS/2)-2, y:0, type, shape};
    }
    function rotate(piece) {
      const newShape = piece.shape[0].map((_,i)=>piece.shape.map(r=>r[i]).reverse());
      return {...piece, shape:newShape};
    }
    function collide(piece,x,y,shape) {
      shape = shape||piece.shape;
      for(let dy=0;dy<shape.length;dy++)
        for(let dx=0;dx<shape[dy].length;dx++)
          if(shape[dy][dx]) {
            const px=x+dx, py=y+dy;
            if(py<0||px<0||px>=COLS||py>=ROWS||arena[py][px]) return true;
          }
      return false;
    }
    function merge(piece) {
      for(let y=0;y<piece.shape.length;y++)
        for(let x=0;x<piece.shape[y].length;x++)
          if(piece.shape[y][x])
            arena[piece.y+y][piece.x+x]=piece.type;
    }
    function clearLines() {
      let lines = 0;
      for(let y=arena.length-1; y>=0; y--) {
        if(arena[y].every(c=>c)) {
          arena.splice(y, 1);
          arena.unshift(Array(COLS).fill(''));
          lines++; y++;
        }
      }
      if(lines) score += lines*100;
      document.getElementById("score").textContent = "Score: "+score;
    }
    function draw() {
      const fit = fitBoard();
      ROWS = fit.rows; cellPx = fit.block;
      setupArenaIfNeeded();
      const tetris = document.getElementById("tetris-board");
      tetris.style.height = (cellPx*ROWS)+'px';
      tetris.style.width = (cellPx*COLS)+'px';
      tetris.innerHTML = "";
      for(let y=0;y<arena.length;y++) {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";
        for(let x=0;x<arena[0].length;x++) {
          const cell = document.createElement("div");
          let c = arena[y][x];
          cell.className = "cell" + (c ? (" "+COLORS[c]) : "");
          cell.style.width = cellPx+'px';
          cell.style.height = cellPx+'px';
          rowDiv.appendChild(cell);
        }
        tetris.appendChild(rowDiv);
      }
      // Draw piece
      for(let y=0; y<falling.shape.length; y++)
        for(let x=0; x<falling.shape[y].length; x++)
          if(falling.shape[y][x]) {
            const boardRow = tetris.children[falling.y+y];
            if(boardRow) {
              const boardCell = boardRow.children[falling.x+x];
              if(boardCell) boardCell.className = "cell "+falling.type;
            }
          }
      drawNext();
    }
    function drawNext() {
      const np = document.getElementById('next-piece');
      np.innerHTML = '';
      const s = SHAPES[next.type];
      const previewCell = Math.max(cellPx*0.7,16);
      for(let y=0;y<4;y++) {
        const rowDiv = document.createElement('div');
        rowDiv.className="row";
        for(let x=0;x<4;x++) {
          const cell = document.createElement('div');
          cell.className = "cell" + ((s[y]&&s[y][x]) ? (" "+next.type) : "");
          cell.style.width = previewCell+'px'; cell.style.height = previewCell+'px';
          rowDiv.appendChild(cell);
        }
        np.appendChild(rowDiv);
      }
    }
    function drop() {
      if(!collide(falling,falling.x,falling.y+1)) falling.y++;
      else {
        merge(falling); clearLines();
        falling = next; next = newPiece();
        if(collide(falling,falling.x,falling.y)) gameOver();
      }
      draw();
    }
    function dropHard() { while(!collide(falling,falling.x,falling.y+1)) falling.y++; drop(); }
    function move(dx) { if(!collide(falling,falling.x+dx,falling.y)) falling.x+=dx; draw(); }
    function rotatePiece() {
      const rot = rotate(falling);
      if(!collide(falling,falling.x,falling.y,rot.shape)) falling.shape=rot.shape;
      draw();
    }
    function gameOver() {
      clearInterval(interval);
      setTimeout(()=>{ alert("Game Over! Score: "+score); window.location.reload(); }, 120);
    }
    document.getElementById("arrow-left").onclick = ()=>move(-1);
    document.getElementById("arrow-right").onclick = ()=>move(1);
    document.getElementById("arrow-down").onclick = ()=>drop();
    document.getElementById("arrow-rot").onclick = ()=>rotatePiece();
    document.addEventListener('keydown',e=>{
      if(e.code==='ArrowLeft') move(-1);
      else if(e.code==='ArrowRight') move(1);
      else if(e.code==='ArrowDown') drop();
      else if(e.code==='ArrowUp') rotatePiece();
      else if(e.code==='Space') dropHard();
    });

    // Touch controls—tap board left/right/middle for move/rot, swipe down for drop
    let startX=null, startY=null;
    document.getElementById("tetris-board").addEventListener('touchstart',function(evt){
      if(evt.touches.length!==1)return;
      startX=evt.touches[0].clientX; startY=evt.touches[0].clientY;
    },{passive:true});
    document.getElementById("tetris-board").addEventListener('touchend',function(evt){
      if(startX===null)return;
      const bounds = document.getElementById("tetris-board").getBoundingClientRect();
      const relX = startX - bounds.left;
      let dx=0, dy=0;
      if(evt.changedTouches.length) {
        dx = evt.changedTouches[0].clientX-startX; dy = evt.changedTouches[0].clientY-startY;
      }
      if(Math.abs(dy)>32&&Math.abs(dy)>Math.abs(dx)) { if(dy>0) drop(); startX=null; startY=null; return;}
      if(relX<bounds.width/3) move(-1);
      else if(relX>bounds.width*2/3) move(1);
      else rotatePiece();
      startX=null; startY=null;
    },{passive:true});
    ["tetris-board","controls","arrow-left","arrow-right","arrow-rot","arrow-down"].forEach(id=>{
      const el=document.getElementById(id); if(!el)return;
      el.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    });

    function setupArenaIfNeeded() {
      if(!arena || arena.length!==ROWS) setupArena(ROWS);
    }
    function resizeAllGame() { if(document.getElementById("game").style.display!=="none") draw(); }
    window.addEventListener("resize", resizeAllGame);

    // === Init game
    SHAPE_KEYS = Object.keys(SHAPES);
    setupArena(DEFAULT_ROWS);
    falling = newPiece(); next = newPiece();
    // Start drawing only after Play pressed
    function startGame() {
      draw();
      interval = setInterval(drop,400);
    }
    document.getElementById("play-btn").onclick = function() {
      document.getElementById("home").style.display = "none";
      document.getElementById("game").style.display = "flex";
      resizeAllGame();
      startGame();
    };
  </script>
</body>
</html>
